kubeProxyReplacement: "true"

k8sServiceHost: "localhost"
k8sServicePort: "6443"

operator:
  replicas: 1
gatewayAPI:
  enabled: true
  hostNetwork:
    enabled: true
ipam:
  operator:
    clusterPoolIPv4PodCIDRList: "10.42.0.0/16"
envoy:
  enabled: true
  securityContext:
    capabilities:
      envoy:
        # Used since cilium proxy uses setting IPPROTO_IP/IP_TRANSPARENT
        - NET_ADMIN
        # We need it for now but might not need it for >= 5.11 specially
        # for the 'SYS_RESOURCE'.
        # In >= 5.8 there's already BPF and PERMON capabilities
        - SYS_ADMIN
        # Both PERFMON and BPF requires kernel 5.8, container runtime
        # cri-o >= v1.22.0 or containerd >= v1.5.0.
        # If available, SYS_ADMIN can be removed.
        #- PERFMON
        #- BPF
        # To allow envoy to use privileged ports
        - NET_BIND_SERVICE
      # To allow envoy to use privileged ports
      keepCapNetBindService: true
hubble:
  # For debugging, the ui and relay can be enabled
  # relay:
  #   enabled: true
  # ui:
  #   enabled: true
  metrics:
    enabled:
    - dns
    - drop
    - tcp
    - flow
    - port-distribution
    - icmp
    - "httpV2:labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"

