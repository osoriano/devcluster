#
# Push flow for jettisonproj/deploy-steps
#
apiVersion: workflows.jettisonproj.io/v1alpha1
kind: Flow
metadata:
  namespace: jettisonproj
  name: deploy-steps-github-push
spec:
  # activeDeadlineSeconds: 3600 # Defaults to 3600 (1h) for push build
  triggers:
  - triggerName: github-push
    triggerSource: GitHubPush
    repoUrl: "https://github.com/jettisonproj/deploy-steps.git"
    # baseRef: "master" # Defaults to main
  steps:
  - stepName: deploy-step-argocd-publish
    stepSource: DockerBuildTestPublish
    dockerContextDir: "argocd" # Defaults to "" (root)
    # dockerfilePath: Dockerfile # Defaults to <dockerContextDir>/Dockerfile
  - stepName: deploy-step-argocd-bump
    stepSource: GitHubCreatePR
    repoUrl: "https://github.com/jettisonproj/jettison-controller.git"
    # baseRef: "master" # Defaults to main
    filePaths:
    - "internal/workflowtemplates/workflowtemplates.go"
    - "testdata"
    dependsOn:
    - deploy-step-argocd-publish

  - stepName: deploy-step-create-pr-publish
    stepSource: DockerBuildTestPublish
    dockerContextDir: "create-pr" # Defaults to "" (root)
    # dockerfilePath: Dockerfile # Defaults to <dockerContextDir>/Dockerfile
  - stepName: deploy-step-create-pr-bump
    stepSource: GitHubCreatePR
    repoUrl: "https://github.com/jettisonproj/jettison-controller.git"
    # baseRef: "master" # Defaults to main
    filePaths:
    - "internal/workflowtemplates/workflowtemplates.go"
    - "testdata"
    dependsOn:
    - deploy-step-create-pr-publish

  - stepName: deploy-step-docker-build-diff-check-publish
    stepSource: DockerBuildTestPublish
    dockerContextDir: "docker-build-diff-check" # Defaults to "" (root)
    # dockerfilePath: Dockerfile # Defaults to <dockerContextDir>/Dockerfile
  - stepName: deploy-step-docker-build-diff-check-bump
    stepSource: GitHubCreatePR
    repoUrl: "https://github.com/jettisonproj/jettison-controller.git"
    # baseRef: "master" # Defaults to main
    filePaths:
    - "internal/workflowtemplates/workflowtemplates.go"
    - "testdata"
    dependsOn:
    - deploy-step-docker-build-diff-check-publish

  - stepName: deploy-step-docker-build-publish
    stepSource: DockerBuildTestPublish
    dockerContextDir: "docker-build" # Defaults to "" (root)
    # dockerfilePath: Dockerfile # Defaults to <dockerContextDir>/Dockerfile
  - stepName: deploy-step-docker-build-bump
    stepSource: GitHubCreatePR
    repoUrl: "https://github.com/jettisonproj/jettison-controller.git"
    # baseRef: "master" # Defaults to main
    filePaths:
    - "internal/workflowtemplates/workflowtemplates.go"
    - "testdata"
    dependsOn:
    - deploy-step-docker-build-publish

  - stepName: deploy-step-github-check-publish
    stepSource: DockerBuildTestPublish
    dockerContextDir: "github-check" # Defaults to "" (root)
    # dockerfilePath: Dockerfile # Defaults to <dockerContextDir>/Dockerfile
  - stepName: deploy-step-github-check-bump
    stepSource: GitHubCreatePR
    repoUrl: "https://github.com/jettisonproj/jettison-controller.git"
    # baseRef: "master" # Defaults to main
    filePaths:
    - "internal/workflowtemplates/workflowtemplates.go"
    - "testdata"
    dependsOn:
    - deploy-step-github-check-publish
