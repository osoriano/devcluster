apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: argo-events
  name: http-argo-github
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: http-osoriano-gw
  hostnames:
  - argo-github.osoriano.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
