apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo-events

resources:
- https://raw.githubusercontent.com/argoproj/argo-events/stable/manifests/install.yaml
- https://raw.githubusercontent.com/argoproj/argo-events/stable/manifests/install-validating-webhook.yaml

# Use newer image than the fix here:
# https://github.com/argoproj/argo-events/issues/2938
# May need to wait or ask for new release
images:
- name: quay.io/argoproj/argo-events
  newName: osoriano/argo-events
  newTag: 493c412d42712d61266db1c294e2c011172b1268

# Use custom install yaml that overrides env var:
# - ARGO_EVENTS_IMAGE
patches:
- path: install-overlay.yaml
- path: resources-patch.yaml
