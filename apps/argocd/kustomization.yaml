apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
- https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
# RBAC to allow sync in any namespace
- github.com/argoproj/argo-cd//examples/k8s-rbac/argocd-server-applications?ref=stable
patches:
- path: argocd-cm-override.yaml
- path: argocd-cmd-params-cm-override.yaml
- path: argocd-rbac-cm-override.yaml
- path: argocd-ui-extensions.yaml
- path: argocd-resources.yaml
