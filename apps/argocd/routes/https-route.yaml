apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: argocd
  name: https-argocd
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: argocd-osoriano-gw
  hostnames:
  - argocd.osoriano.com
  rules:
  - backendRefs:
    - name: argocd-server
      port: 80
