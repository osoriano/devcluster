apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-cm
data:
  # Add jettisonproj user to perform sync operation after git updates
  accounts.jettisonproj: apiKey, login
  # Add readonly user for convenience
  accounts.readonly: apiKey, login
  # Use less frequent syncs since CI/CD sends the sync signal
  # todo: would ideally sync Monday mornings
  timeout.reconciliation: 168h
