apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
  name: argocd-rbac-cm
data:
  # Allow sync operations for jettisonproj user
  # Also, allow a readonly user for convenience
  policy.csv: |
    p, jettisonproj, applications, get, *, allow
    p, jettisonproj, applications, sync, *, allow
    g, readonly, role:readonly
