apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: kube-system
  name: https-headlamp
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: headlamp-osoriano-gw
  hostnames:
  - headlamp.osoriano.com
  rules:
  - backendRefs:
    - name: headlamp
      port: 80
