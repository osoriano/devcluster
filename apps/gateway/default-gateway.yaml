apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  namespace: default
  name: default-gateway
spec:
  gatewayClassName: cilium
  listeners:
  # HTTP listener. Should only be used to redirect to HTTPS
  - name: http-gw
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All

  # jettisonproj listeners
  - name: rollouts-demo-osoriano-gw
    protocol: HTTPS
    port: 443
    hostname: "rollouts-demo.osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: jettisonproj
  - name: rollouts-demo-staging-osoriano-gw
    protocol: HTTPS
    port: 443
    hostname: "rollouts-demo-staging.osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: jettisonproj
  - name: rollouts-demo-dev-osoriano-gw
    protocol: HTTPS
    port: 443
    hostname: "rollouts-demo-dev.osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: jettisonproj
  - name: jettison-osoriano-gw
    protocol: HTTPS
    port: 443
    hostname: "jettison.osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: jettisonproj

  # wavesmp listeners
  - name: wavesmp-gw
    protocol: HTTPS
    port: 443
    hostname: "wavesmusicplayer.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: wavesmp
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: wavesmp
  - name: www-wavesmp-gw
    protocol: HTTPS
    port: 443
    hostname: "www.wavesmusicplayer.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: wavesmp
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: wavesmp

  # osoriano listeners
