    protocol: HTTPS
    port: 443
    hostname: "osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: osoriano
  - name: www-osoriano-gw
    protocol: HTTPS
    port: 443
    hostname: "www.osoriano.com"
    tls:
      certificateRefs:
      - kind: Secret
        name: osoriano
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            kubernetes.io/metadata.name: osoriano

  # argocd listener
