apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-cainjector
spec:
  template:
    spec:
      containers:
      - name: cert-manager-cainjector
        resources:
          requests:
            memory: 160Mi
            cpu: 10m
          limits:
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager
spec:
  template:
    spec:
      containers:
      - name: cert-manager-controller
        resources:
          requests:
            memory: 64Mi
            cpu: 10m
          limits:
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cert-manager
  name: cert-manager-webhook
spec:
  template:
    spec:
      containers:
      - name: cert-manager-webhook
        resources:
          requests:
            memory: 32Mi
            cpu: 10m
          limits:
            memory: 128Mi
