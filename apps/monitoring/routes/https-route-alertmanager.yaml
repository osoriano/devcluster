apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: monitoring
  name: alertmanager
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: alertmanager-osoriano-gw
  hostnames:
  - alertmanager.osoriano.com
  rules:
  - backendRefs:
    - name: alertmanager-main
      port: 9093
