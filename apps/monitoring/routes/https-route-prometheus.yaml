apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: monitoring
  name: prometheus
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: prometheus-osoriano-gw
  hostnames:
  - prometheus.osoriano.com
  rules:
  - backendRefs:
    - name: prometheus-k8s
      port: 9090
