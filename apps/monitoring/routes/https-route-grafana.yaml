apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: monitoring
  name: https-grafana
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: grafana-osoriano-gw
  hostnames:
  - grafana.osoriano.com
  rules:
  - backendRefs:
    - name: grafana
      port: 3000
