apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: monitoring
  name: http-alertmanager
spec:
  parentRefs:
  - name: default-gateway
    namespace: default
    sectionName: http-gw
  hostnames:
  - alertmanager.osoriano.com
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
