apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo
resources:
- argo-mysql-config.yaml
- https://github.com/argoproj/argo-workflows/releases/latest/download/install.yaml
# Use custom install yaml with:
# --secure=false since TLS is terminated in the gateway
# Also has an updated readiness probe scheme
patches:
- path: install-overlay.yaml
- path: workflow-controller-configmap.yaml
- path: resources-patch.yaml
